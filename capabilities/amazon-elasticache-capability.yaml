    namespace: amazon-elasticache-rest
    description: REST adapter for Amazon ElastiCache API.
    resources:
    - path: /
      name: createcachecluster
      operations:
      - method: POST
        name: createcachecluster
        description: Amazon ElastiCache Create Cache Cluster
        call: amazon-elasticache.createcachecluster
        outputParameters:
        - type: object
