    namespace: amazon-elasticache
    baseUri: https://elasticache.amazonaws.com
    description: Amazon ElastiCache API HTTP API.
    authentication:
      type: apikey
      in: header
      name: Authorization
      value: '{{AMAZON_ELASTICACHE_TOKEN}}'
    resources:
    - name: resource
      path: /
      operations:
      - name: createcachecluster
        method: POST
        description: Amazon ElastiCache Create Cache Cluster
        inputParameters:
        - name: Action
          in: query
          type: string
          required: true
        - name: Version
          in: query
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: describecacheclusters
        method: GET
        description: Amazon ElastiCache Describe Cache Clusters
        inputParameters:
        - name: Action
          in: query
          type: string
          required: true
        - name: Version
          in: query
          type: string
          required: true
        - name: CacheClusterId
          in: query
          type: string
          description: The user-supplied cluster identifier.
        - name: ShowCacheNodeInfo
          in: query
          type: boolean
          description: If true, lists individual cache node information.
        - name: MaxRecords
          in: query
          type: integer
          description: The maximum number of records to include in the response.
        - name: Marker
          in: query
          type: string
          description: An optional marker returned from a prior request.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
