naftiko: 1.0.0-alpha2
info:
  label: Amazon ElastiCache API
  description: Amazon ElastiCache is a fully managed in-memory caching service supporting Redis and Memcached for improving
    the performance of web applications.
  tags:
  - Amazon
  - Elasticache
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
