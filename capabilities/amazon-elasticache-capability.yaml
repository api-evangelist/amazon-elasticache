        description: Amazon ElastiCache Delete Cache Cluster
        inputParameters:
        - name: Action
          in: query
          type: string
          required: true
        - name: Version
          in: query
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: createreplicationgroup
      path: /#CreateReplicationGroup
      operations:
      - name: createreplicationgroup
        method: POST
        description: Amazon ElastiCache Create Replication Group
        inputParameters:
        - name: Action
          in: query
          type: string
          required: true
        - name: Version
          in: query
          type: string
          required: true
