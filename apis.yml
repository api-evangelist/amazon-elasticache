name: Amazon ElastiCache
description: >-
  Amazon ElastiCache is a fully managed in-memory caching service supporting Redis and Memcached. ElastiCache makes it
  easy to deploy, operate, and scale popular open-source compatible in-memory data stores, improving the performance of
  web applications.
